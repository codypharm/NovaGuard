name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: ruff check . || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/nova-guard-api:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/nova-guard-api:latest .
          docker push $ECR_REGISTRY/nova-guard-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/nova-guard-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update ECS task definition
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TASK_DEFINITION=$(cat aws/task-definition.json | \
            sed "s/\${AWS_ACCOUNT_ID}/${{ secrets.AWS_ACCOUNT_ID }}/g" | \
            sed "s/\${AWS_REGION}/${{ secrets.AWS_REGION }}/g" | \
            sed "s|\${DATABASE_URL}|${{ secrets.DATABASE_URL }}|g" | \
            sed "s|\${AWS_ACCESS_KEY_ID}|${{ secrets.AWS_ACCESS_KEY_ID }}|g" | \
            sed "s|\${AWS_SECRET_ACCESS_KEY}|${{ secrets.AWS_SECRET_ACCESS_KEY }}|g" | \
            sed "s|\${NOVA_API_KEY}|${{ secrets.NOVA_API_KEY }}|g" | \
            sed "s|\${S3_BUCKET}|${{ secrets.S3_BUCKET }}|g")
          
          TASK_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEFINITION" \
            --query 'taskDefinition.revision' \
            --output text)
          
          echo "Task revision: $TASK_REVISION"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --task-definition nova-guard-api \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create frontend env file
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > frontend/.env.production
          echo "VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" >> frontend/.env.production

      - name: Build and deploy frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }} --delete
